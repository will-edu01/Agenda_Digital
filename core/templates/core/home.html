{% extends "core/base.html" %}
{% load static %}

{% block content %}

<div class="page-wrapper">

    <h1 class="section-title">Serviços</h1>
    <p class="section-sub">Selecione um ou mais serviços para continuar</p>

    <form id="services-form" method="post" action="{% url 'select_datetime' %}">
        {% csrf_token %}

        <div class="services-grid">
            {% for s in services %}
            <label class="service-item">
                <input type="checkbox" name="services" value="{{ s.id }}">
                <span>
                    <strong>{{ s.name }}</strong>
                </span>
                <div class="service-meta">
                    R$ {{ s.price }}<br>
                    {{ s.duration_minutes }} min
                </div>
            </label>
            {% endfor %}
        </div>

        <div class="summary-text">
            <p>Tempo total: <strong id="total-duration">0</strong> min</p>
            <p>Preço total: <strong id="total-price">0.00</strong></p>
        </div>

        <div style="text-align:center; margin-top:25px;">
            <button id="continue-btn" class="btn-primary" type="submit" disabled>Continuar</button>
        </div>

    </form>

</div>

<script>
// -------- ATUALIZA TEMPO E PREÇO EM TEMPO REAL --------
document.addEventListener("DOMContentLoaded", () => {
    const checkboxes = document.querySelectorAll("input[name='services']");
    const totalDuration = document.getElementById("total-duration");
    const totalPrice = document.getElementById("total-price");
    const continueBtn = document.getElementById("continue-btn");

    function updateSummary() {
        let duration = 0;
        let price = 0;

        checkboxes.forEach(cb => {
            if (cb.checked) {
                const meta = cb.parentElement.querySelector(".service-meta").innerHTML;
                const priceMatch = meta.match(/R\$ ([0-9.,]+)/);
                const minMatch = meta.match(/(\d+) min/);

                if (priceMatch) price += parseFloat(priceMatch[1].replace(",", "."));
                if (minMatch) duration += parseInt(minMatch[1]);
            }
        });

        totalDuration.textContent = duration;
        totalPrice.textContent = price.toFixed(2);

        continueBtn.disabled = duration === 0;
    }

    checkboxes.forEach(cb => cb.addEventListener("change", updateSummary));
});
</script>

{% endblock %}
