{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Verificação de E-mail</h2>
    <p>Enviamos um código para: <strong>{{ email }}</strong></p>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="code" placeholder="Código" required class="input-field">
        <button type="submit" class="button">Confirmar</button>
    </form>
</div>
{% endblock %}
